{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | Price Sniper</title>
    <link rel="stylesheet" href="{% static 'tracker/style.css' %}">
    <style>
        /* This ensures the Django Form looks as good as the Login inputs */
        p { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        label { display: block; margin-bottom: 5px; color: #555; font-size: 0.9rem; }
        .helptext { font-size: 0.75rem; color: #777; } /* Styling for password requirements */
    </style>
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; background-color: #f4f7f6; font-family: sans-serif;">

    <div style="background:white; padding:40px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); width: 350px;">
        <h2 style="color: #28587B; text-align: center; margin-bottom: 20px;">Create Account</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <button type="submit" style="width:100%; padding:12px; background:#28587B; color:white; border:none; border-radius:5px; cursor:pointer; font-weight: bold; margin-top: 10px;">
                Sign Up
            </button>
        </form>

        <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
            Already have an account? <a href="{% url 'login' %}" style="color: #28587B; text-decoration: none;">Login here</a>
        </p>
    </div>

</body>
</html>
