{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Price Sniper</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'tracker/style.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 class="auth-logo"><i class="fa-solid fa-crosshairs"></i> Price Sniper</h1>
            <p class="auth-subtitle">Create a free account to track items</p>
            
            {% if success %}
                <div class="auth-success">
                    <i class="fa-solid fa-circle-check"></i> {{ success }}
                </div>
            {% endif %}

            {% if error %}
                <div class="auth-error">
                    <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
                </div>
            {% endif %}

            {% if not success %}
            <form method="POST" class="auth-form">
                {% csrf_token %}
                
                {{ form.as_p }}
                
                <button type="submit" class="auth-submit-btn">
                    <i class="fa-solid fa-user-plus"></i> Create Account
                </button>
            </form>

            <div class="auth-divider">
                <span>or</span>
            </div>

            <form action="{% url 'social:begin' 'google-oauth2' %}" method="post" style="width: 100%;">
                {% csrf_token %}
                <button type="submit" class="google-btn" style="width: 100%; border: 1px solid #E5E7EB; font-family: inherit;">
                    <i class="fa-brands fa-google"></i> Continue with Google
                </button>
            </form>
            {% endif %}

            <div class="auth-footer">
                Already have an account? <a href="{% url 'login' %}">Login here</a>
            </div>
        </div>
    </div>
</body>
</html>
