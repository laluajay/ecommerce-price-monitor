{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Price Sniper</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'tracker/style.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 class="auth-logo"><i class="fa-solid fa-crosshairs"></i> Price Sniper</h1>
            <p class="auth-subtitle">Login to your account to monitor prices</p>
            
            {% if error %}
                <div class="auth-error">
                    <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
                </div>
            {% endif %}

            {% if success %}
                <div class="auth-success">
                    <i class="fa-solid fa-circle-check"></i> {{ success }}
                </div>
            {% endif %}

            <form method="POST" class="auth-form">
                {% csrf_token %}
                <p>
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" placeholder="Enter your username" required autofocus>
                </p>
                <p>
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password" required>
                </p>
                
                <button type="submit" class="auth-submit-btn">
                    <i class="fa-solid fa-right-from-bracket"></i> Login
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="{% url 'register' %}">Register here</a>
            </div>
        </div>
    </div>
</body>
</html>
