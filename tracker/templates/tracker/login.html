{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Price Sniper</title>
    <link rel="stylesheet" href="{% static 'tracker/style.css' %}">
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; background-color: #f4f7f6; font-family: sans-serif;">
    
    <div style="background:white; padding:40px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); width: 350px;">
        <h2 style="color: #28587B; text-align: center; margin-bottom: 20px;">Login to Price Sniper</h2>
        
        {% if error %}
            <p style="color:red; text-align: center;">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required style="display:block; margin-bottom:15px; width:100%; padding:10px; border:1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
            <input type="password" name="password" placeholder="Password" required style="display:block; margin-bottom:15px; width:100%; padding:10px; border:1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
            
            <button type="submit" style="width:100%; padding:12px; background:#28587B; color:white; border:none; border-radius:5px; cursor:pointer; font-weight: bold;">
                Login
            </button>
        </form>

        <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
            Don't have an account? <a href="{% url 'register' %}" style="color: #28587B; text-decoration: none;">Register here</a>
        </p>
    </div>
</body>
</html>
